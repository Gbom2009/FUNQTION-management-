# Builds the Mac desktop app (Funqtion.app + .dmg, Apple Silicon) — needed for
# the Library (app 7) to read and write your music folders and USB drives.
# macOS build minutes count 10× on GitHub, so this only runs by hand
# ("Run workflow" on the Actions tab) and for version tags.
# The app is not signed: the first time, right-click → Open on the Mac.
name: Desktop (Mac app)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build Mac app
        run: npx tauri build --bundles app,dmg
      - name: Collect files
        run: |
          mkdir -p out
          cp -R src-tauri/target/release/bundle/dmg/*.dmg out/
          (cd src-tauri/target/release/bundle/macos && zip -qry "$GITHUB_WORKSPACE/out/Funqtion-mac.app.zip" *.app)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Funqtion-mac-${{ github.sha }}
          path: out/*
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
