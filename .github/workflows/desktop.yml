# Builds the Windows desktop app (Funqtion.exe) on every push.
# Download it from the run's "Artifacts" section on the Actions tab.
# Run it by hand for any branch via "Run workflow".
# Pushing a tag like v0.2.0 also publishes a GitHub Release with the installers.
name: Desktop (Windows exe)

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build desktop app
        run: npx tauri build
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/funqtion.exe out/Funqtion-portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: Funqtion-windows-${{ github.sha }}
          path: out/*
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
