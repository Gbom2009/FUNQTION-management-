# Publishes the web app to GitHub Pages on every push to main:
#   https://gbom2009.github.io/FUNQTION-management-/
# The built site is pushed to the `gh-pages` branch, which GitHub serves
# automatically. If the site does not appear, check repo Settings > Pages >
# Source: "Deploy from a branch", branch `gh-pages`, folder `/ (root)`.
# On iPhone/iPad: open the URL in Safari > Share > Add to Home Screen.
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add .nojekyll and 404 fallback
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy web app'
