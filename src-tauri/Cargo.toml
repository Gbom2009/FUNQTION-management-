[package]
name = "funqtion"
version = "0.6.0"
description = "Team Funqtion business suite - FEEL THE MUSIQ"
authors = ["Team Funqtion"]
edition = "2021"

[lib]
name = "funqtion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
